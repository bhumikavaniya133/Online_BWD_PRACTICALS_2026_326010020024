<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        .profile {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #cccccc;
            text-align: center;
        }

        h1 {
            color: #173b70;
        }

        h2 {
            color: #512da8;
        }

        p {
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="profile">
        <h1>Student Profile</h1>
        <h2>BCA Student</h2>

        <p><strong>Name:</strong> Your Name</p>
        <p><strong>Course:</strong> Bachelor of Computer Applications</p>
        <p><strong>University:</strong> Marwadi University</p>
        <p><strong>Skills:</strong> HTML, CSS, JavaScript</p>
        <p><strong>Career Goal:</strong> Network Engineer</p>
    </div>
</body>
</html>
